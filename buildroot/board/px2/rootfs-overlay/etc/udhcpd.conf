# The computer on the other end of the USB cable, given an address beside the
# Pixel's 10.42.0.1 (S40usbgadget). No router and no DNS: the link reaches the
# Pixel and nothing else, so a computer never sends its internet traffic this
# way. Leases go to /var/lib/misc, which is /tmp.
interface usb0
start 10.42.0.2
end 10.42.0.20
option subnet 255.255.255.0
option lease 86400
lease_file /var/lib/misc/udhcpd.leases
