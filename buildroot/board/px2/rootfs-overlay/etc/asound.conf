# Sound: "default" mixes everyone who plays at once (dmix) into the RK817's
# one output, so two programs can have sound open together (an emulator and a
# music player, say). Plain hw:0 lets only one in at a time.
pcm.!default {
	type plug
	slave.pcm "mixed"
}

pcm.mixed {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 2
		# 512 frames is 10.7 ms; four of them, 43 ms, is what dmix keeps
		# queued for the card
		period_size 512
		buffer_size 2048
	}
}

ctl.!default {
	type hw
	card 0
}
