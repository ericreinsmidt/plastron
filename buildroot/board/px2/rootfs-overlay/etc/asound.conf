# Sound: "default" mixes everyone who plays at once (dmix) into the RK817's
# one output, so two programs can have sound open together (an emulator and a
# music player, say). Plain hw:0 lets only one in at a time.
pcm.!default {
	type plug
	slave.pcm "mixed"
}

pcm.mixed {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		format S16_LE
		rate 48000
		channels 2
		# 512 frames is 10.7 ms; four of them, 43 ms, is what dmix keeps
		# queued for the card
		period_size 512
		buffer_size 2048
	}
}

# A USB-C DAC, when one is plugged in: the first sound card after the RK817's.
# Mixed the same way, so the game and Muse can both have it open, where a USB
# card alone takes one program at a time. Opening it with no DAC in fails,
# and the program stays on (or falls back to) the default.
#
# The volume is a software one in front of the mix, its control on card 0,
# where TortOS and diatom write it with every level; the DAC's own control
# is set to full when it appears (usbrole). Every DAC then sounds the same
# way under the same keys, whatever its own control is called or goes to.
# 0-255 over -95.625 to 0 dB is 0.375 dB a step, the RK817's step. TortOS
# makes the control at startup in this shape (its src/device/pixel2.c);
# change one, change the other.
#
# The mix is 24-bit, the most the Apple adapter takes, so turning the volume
# down loses none of the 16-bit sound coming in. A DAC without 24-bit gets
# 32 or 16, alsa-lib's next choices.
pcm.usb {
	type plug
	slave.pcm "usbvolume"
}

pcm.usbvolume {
	type softvol
	slave.pcm "usbmixed"
	control {
		name "USB Playback Volume"
		card 0
	}
	min_dB -95.625
	max_dB 0.0
	resolution 256
}

pcm.usbmixed {
	type dmix
	ipc_key 1025
	ipc_perm 0666
	slave {
		pcm "hw:1,0"
		format S24_3LE
		rate 48000
		channels 2
		period_size 512
		buffer_size 2048
	}
}

ctl.!default {
	type hw
	card 0
}
