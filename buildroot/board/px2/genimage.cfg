# The card: the bootloader from sector 64 (Rockchip's DDR init and miniloader,
# our U-Boot and TF-A's BL31; see scripts/pack-bootloader.sh), then a FAT boot
# partition at 16 MiB
# (where Rockchip's layout leaves room for the bootloader), then root:
# squashfs, read-only, in a 256 MB partition (as on the Brick, so a bigger
# root still fits and the games partition after it stays where it is).
image boot.vfat {
	vfat {
		label = "PX2BOOT"
		files = {
			"Image",
			"rk3326s-gkd-pixel2.dtb",
			"boot.scr"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-px2.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 256M
	}
}
