# The card: the bootloader from sector 64 (ROCKNIX's, with our own U-Boot;
# see scripts/pack-bootloader.sh), then a FAT boot partition at 16 MiB
# (where Rockchip's layout leaves room for the bootloader), then root.
image boot.vfat {
	vfat {
		label = "PX2BOOT"
		files = {
			"Image",
			"rk3326s-gkd-pixel2.dtb",
			"boot.scr"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-px2.bin"
		offset = 32K
	}

	partition boot {
		partition-type = 0xC
		bootable = true
		image = "boot.vfat"
		offset = 16M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
