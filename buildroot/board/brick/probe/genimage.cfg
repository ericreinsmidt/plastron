# The Brick panel probe's card: the Brick's boot loader 128 KiB in and its
# boot partition at 4 MiB, as on the full card (board/brick/genimage.cfg), with
# the probe as the initramfs and nothing after it: no root, no games partition.
image boot.vfat {
	vfat {
		label = "BRICKPROBE"
		files = {
			"Image",
			"brick.dtb",
			"initramfs.cpio.gz",
			"boot.scr",
			"README.txt"
		}
	}
	size = 32M
}

image brick-panel-probe.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
	}

	partition boot {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "boot.vfat"
		offset = 4M
	}
}
