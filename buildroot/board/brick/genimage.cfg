# The TrimUI Brick's card: the boot loader 128 KiB in (where the A133's boot
# ROM looks when there's nothing at 8 KiB, which the GPT's own sectors keep
# clear), then the boot partition (FAT) at 4 MiB, then the root. GPT, as the
# Brick finds its partitions by name: rootswitch mounts plastron-root, and the
# first boot adds the games partition, tortos, over the rest of the card.
image boot.vfat {
	vfat {
		label = "BRICKBOOT"
		files = {
			"Image",
			"brick.dtb",
			"initramfs.cpio.gz",
			"boot.scr"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
	}

	partition boot {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "boot.vfat"
		offset = 4M
	}

	partition plastron-root {
		partition-type-uuid = "L"
		image = "rootfs.ext4"
	}
}
