# The TrimUI Brick's card: the boot loader 128 KiB in (where the A133's boot
# ROM looks when there's nothing at 8 KiB, which the GPT's own sectors keep
# clear), then the boot partition (FAT) at 4 MiB, then the root (squashfs,
# read-only, in a 256 MB partition so a bigger root still fits), then the
# state partition (ext4, 16 MB) for what has to last. GPT, as the Brick finds
# its partitions by name: rootswitch mounts plastron-root, init.d/bluetooth
# plastron-state, and the first boot adds the games partition, tortos, over
# the rest of the card.
image boot.vfat {
	vfat {
		label = "BRICKBOOT"
		files = {
			"Image",
			"Image.lz4",
			"brick.dtb",
			"initramfs.cpio.gz",
			"boot.scr"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 128K
	}

	partition boot {
		partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
		image = "boot.vfat"
		offset = 4M
	}

	partition plastron-root {
		partition-type-uuid = "L"
		image = "rootfs.squashfs"
		size = 256M
	}

	partition plastron-state {
		partition-type-uuid = "L"
		image = "state.ext4"
	}
}
