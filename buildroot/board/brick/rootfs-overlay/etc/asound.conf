# ALSA's default is a shared mixer, as on TrimUI's system, so Diatom and Muse
# both play: on the bare hardware whoever opened it first kept it
pcm.!default { type plug; slave.pcm "mixer" }
ctl.!default { type hw; card 0 }
pcm.mixer {
	type dmix
	ipc_key 1024
	ipc_perm 0666
	slave { pcm "hw:0,0"; format S16_LE; channels 2; rate 48000; period_size 1024; buffer_size 4096 }
}
